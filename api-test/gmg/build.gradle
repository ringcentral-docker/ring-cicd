plugins {
    id "java"
    id "com.softeq.gradle.itest" version "1.0.4"
}

group = 'com.ringcentral'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.10.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'org.slf4j:slf4j-simple:2.0.12'
    testImplementation 'org.apache.kafka:kafka-clients:3.8.0'
    testImplementation 'org.java-websocket:Java-WebSocket:1.5.6'
    testImplementation 'redis.clients:jedis:5.1.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'
    
    // Swagger coverage for API testing
    testImplementation "com.github.viclovsky:swagger-coverage-rest-assured:1.5.0"
    
    // 添加Lombok依赖
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

test {
    outputs.cacheIf { false } // disables caching

    systemProperties System.getProperties()
    useTestNG() {
        useDefaultListeners = true
        includeGroups System.getProperty('includeGroups', 'P0,P1,P2')
        systemProperty 'env', System.getProperty('env', 'ci')
    }
}

sourceSets {
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}